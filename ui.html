<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skillview</title>
<style>
/* ── Notion design system ────────────────────────────────────────────────────
   Values from Notion's published system. Light is the source of truth; the dark
   set is derived from Notion's own navy scale, which is the only dark ground the
   brand actually uses. Colour marks exceptions — the two states that ask
   something of you — and everything at rest is ink on hairlines.
   ────────────────────────────────────────────────────────────────────────── */
:root{
  --canvas:#ffffff; --surface:#f6f5f4; --surface-soft:#fafaf9; --raised:#ffffff;
  --hairline:#e5e3df; --hairline-soft:#ede9e4; --hairline-strong:#c8c4be;
  --ink:#1a1a1a; --charcoal:#37352f; --slate:#5d5b54; --steel:#6b6963;
  /* Notion's published --stone (#a4a097) and --steel (#787671) sit at 2.8:1 and
     4.54:1 on white. Secondary text is darkened onto the same warm-grey axis so
     the tertiary tier clears AA with margin rather than sitting on the line. */
  --stone:#75736c; --muted:#82807a;
  --primary:#5645d4; --primary-pressed:#4534b3; --on-primary:#ffffff;
  --primary-wash:#eeebfb;
  /* Notion's semantics are tuned for fills, not for text on white — its green
     measures 2.93:1 as type. Darkened along the same hue until each clears AA. */
  --success:#15812c; --warning:#b34900; --error:#c92a2a;
  --tint-lavender:#e6e0f5; --tint-sky:#dcecfa; --tint-mint:#d9f3e1;
  --tint-peach:#ffe8d4; --tint-rose:#fde0ec; --tint-gray:#f0eeec;
  --on-tint:#37352f;
  --code-bg:#f6f5f4; --code-ink:#37352f;
  --scrim:rgba(15,15,15,.34);
  --shadow-panel:0 8px 32px rgba(15,15,15,.14), 0 2px 8px rgba(15,15,15,.08);
  --shadow-pop:0 2px 6px rgba(15,15,15,.07);
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-full:9999px;
  --sans:"Inter","Notion Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
:root[data-theme="dark"]{
  --canvas:#070f24; --surface:#0a1530; --surface-soft:#0d1a38; --raised:#101f42;
  --hairline:#1e2d54; --hairline-soft:#16244a; --hairline-strong:#2c3f6e;
  --ink:#ffffff; --charcoal:#eef1f8; --slate:#c3cbe0; --steel:#a8b1c8;
  --stone:#98a1b8; --muted:#8b94ac;
  --primary:#9b7bf7; --primary-pressed:#b49bfa; --on-primary:#0a1530;
  --primary-wash:#1c2a55;
  --success:#5fd97e; --warning:#f0a355; --error:#f27272;
  --tint-lavender:#2a2456; --tint-sky:#16305a; --tint-mint:#14402a;
  --tint-peach:#4a2a12; --tint-rose:#4a1d38; --tint-gray:#1a2749;
  --on-tint:#dfe5f5;
  --code-bg:#0a1530; --code-ink:#cdd6ee;
  --scrim:rgba(3,7,18,.62);
  --shadow-panel:0 8px 40px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4);
  --shadow-pop:0 2px 6px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--canvas); color:var(--charcoal);
  font:14px/1.5 var(--sans); -webkit-font-smoothing:antialiased;
}
.mono{font-family:var(--mono);font-size:12.5px}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:3px}
:focus:not(:focus-visible){outline:none}

/* ── chrome ─────────────────────────────────────────────────────────────── */
header{
  position:sticky;top:0;z-index:20;background:var(--canvas);
  border-bottom:1px solid var(--hairline);padding:16px 24px 0;
}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:18px;font-weight:600;letter-spacing:-.2px;margin:0;color:var(--ink)}
.count{color:var(--stone);font-size:13px}
.spacer{flex:1}
button{
  font:500 14px/1.3 var(--sans);color:var(--charcoal);background:transparent;
  border:1px solid var(--hairline-strong);border-radius:var(--r-md);
  padding:10px 16px;cursor:pointer;min-height:44px;
  transition:background .12s ease,border-color .12s ease;
}
button:hover:not(:disabled){background:var(--surface)}
button:disabled{color:var(--muted);border-color:var(--hairline);cursor:default}
button.primary{
  background:var(--primary);color:var(--on-primary);border-color:var(--primary);
}
button.primary:hover:not(:disabled){background:var(--primary-pressed);border-color:var(--primary-pressed)}
button.primary:disabled{background:var(--hairline);border-color:var(--hairline);color:var(--muted)}
.icon-btn{padding:10px;min-width:44px;display:grid;place-items:center}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round}

.views{display:flex;gap:4px;margin-top:14px;flex-wrap:wrap}
.views button{
  background:none;border:none;border-bottom:2px solid transparent;border-radius:0;
  color:var(--steel);padding:8px 12px;min-height:44px;font-weight:500;
}
.views button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--primary)}
.views button:hover{color:var(--ink);background:transparent}
.views .n{color:var(--stone);font-size:12px;margin-left:6px;font-variant-numeric:tabular-nums}

.filters{display:flex;gap:8px;padding:12px 0 14px;flex-wrap:wrap;align-items:center}
input[type=search],select{
  font:14px var(--sans);color:var(--charcoal);background:var(--canvas);
  border:1px solid var(--hairline-strong);border-radius:var(--r-md);
  padding:9px 12px;min-height:44px;
}
input[type=search]{min-width:260px;flex:0 1 320px}
input[type=search]::placeholder{color:var(--steel);opacity:1}
select{cursor:pointer}
:is(input,select).active{border-color:var(--primary);background:var(--primary-wash)}
#clear{display:none}
#clear.show{display:inline-flex;align-items:center;gap:6px}

/* ── table ──────────────────────────────────────────────────────────────── */
main{padding:0 24px 64px}
/* No overflow container at desktop: an overflow ancestor creates its own scroll
   context, which silently breaks the sticky header row below. The horizontal
   scroller is only needed where the table actually outgrows the viewport, so it
   is switched on at the narrow breakpoint instead. */
.tablewrap{overscroll-behavior-x:contain}
table{width:100%;border-collapse:collapse}
thead th{
  /* --head-h is measured from the real header, so this never drifts when the
     filter row wraps to two lines. */
  position:sticky;top:var(--head-h,0px);background:var(--canvas);z-index:10;text-align:left;
  font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
  color:var(--steel);border-bottom:1px solid var(--hairline-strong);
  white-space:nowrap;padding:0;
}
thead th button{
  width:100%;border:none;border-radius:0;background:none;font:inherit;
  color:inherit;text-transform:inherit;letter-spacing:inherit;
  padding:10px 12px;min-height:40px;display:flex;align-items:center;gap:6px;
}
thead th button:hover{background:var(--surface);color:var(--ink)}
thead th svg{width:12px;height:12px;opacity:.85}
tbody tr{border-bottom:1px solid var(--hairline-soft);cursor:pointer}
tbody tr:hover{background:var(--surface-soft)}
tbody tr:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
td{padding:12px;vertical-align:top}
td.name{white-space:nowrap;font-weight:500;color:var(--ink)}
td.name .sub{display:block;font-weight:400;color:var(--stone);font-size:12px;margin-top:2px}
td.plain{color:var(--slate);max-width:420px;min-width:240px}
td.plain span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
              overflow:hidden}
td.plain .raw{color:var(--steel)}
.pill{
  display:inline-block;padding:3px 9px;border-radius:var(--r-full);font-size:12px;
  font-weight:500;background:var(--tint-gray);color:var(--on-tint);white-space:nowrap;
}
/* Keyed on a data attribute, not a class: mechanism names contain dots
   ("skills.sh"), and a dot in a class attribute starts a second class. */
.pill[data-m="marketplace"]{background:var(--tint-lavender)}
.pill[data-m="skills.sh"]{background:var(--tint-sky)}
.pill[data-m="local"]{background:var(--tint-mint)}
.pill[data-m="unknown"]{background:var(--tint-peach)}
.pill[data-m="mcp"]{background:var(--tint-rose)}
.state{font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.s-rest{color:var(--stone)}
.s-act{color:var(--warning);font-weight:500}
.s-ok{color:var(--success)}
.chev{color:var(--stone)}
tbody tr:hover .chev{color:var(--primary)}
.chev svg{width:16px;height:16px}
.empty{padding:80px 24px;text-align:center;color:var(--stone)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px;font-weight:600}

/* ── detail panel ───────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;opacity:0;
       pointer-events:none;transition:opacity .18s ease}
.scrim.on{opacity:1;pointer-events:auto}
aside{
  position:fixed;top:0;right:0;bottom:0;width:min(700px,96vw);z-index:31;
  background:var(--canvas);border-left:1px solid var(--hairline);
  box-shadow:var(--shadow-panel);
  transform:translateX(100%);transition:transform .26s cubic-bezier(.16,1,.3,1);
  overflow-y:auto;padding:24px 28px 72px;
}
aside.on{transform:none}
aside h2{margin:0 0 4px;font-size:22px;font-weight:600;letter-spacing:-.3px;color:var(--ink)}
aside .by{color:var(--stone);font-size:13px;margin-bottom:20px}
aside .x{position:absolute;top:18px;right:22px}
.blurb{
  background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--r-lg);padding:14px 16px;margin:0;color:var(--charcoal);
  font-size:15px;line-height:1.55;
}
.blurb.rawnote{color:var(--slate)}
.fields{display:grid;grid-template-columns:minmax(96px,132px) 1fr;gap:9px 18px;
        margin:20px 0 26px;font-size:14px}
.fields dt{color:var(--stone)}
.fields dd{margin:0;word-break:break-word;color:var(--charcoal)}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--steel);
   margin:28px 0 10px;font-weight:600}
ol.subs{margin:0;padding:0;list-style:none}
ol.subs li{
  background:var(--surface-soft);border:1px solid var(--hairline);
  border-radius:var(--r-md);padding:10px 14px 10px 42px;margin-bottom:6px;position:relative;
}
ol.subs li::before{
  content:attr(data-n);position:absolute;left:14px;top:10px;color:var(--stone);
  font-size:12px;font-family:var(--mono);
}
ol.subs .inv{color:var(--primary);font-weight:600}
ol.subs .does{display:block;color:var(--slate);font-size:13px;margin-top:3px}
.kindhead{color:var(--steel);font-size:11px;text-transform:uppercase;
          letter-spacing:.5px;margin:16px 0 7px;font-weight:600}

/* Pack catalog — what the source repo ships beyond what you took. Uninstalled
   entries stay legible rather than being dimmed into unreadability: they are
   the reason this section exists. */
ul.pack{margin:0;padding:0;list-style:none}
ul.pack li{
  display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;
  padding:10px 0;border-bottom:1px solid var(--hairline-soft);
}
ul.pack li:last-child{border-bottom:none}
/* Every cell is placed explicitly. An item with only a definite row gets
   placed before the auto-flow items and steals column 1. */
ul.pack .nm{grid-area:1/1;font-weight:500;color:var(--ink)}
ul.pack .badge{
  grid-area:1/2;font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;
  color:var(--success);white-space:nowrap;
}
ul.pack .d{
  grid-area:2/1/3/3;color:var(--slate);font-size:13px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
ul.pack li.off .nm{color:var(--stone)}
ul.pack li.off .d{color:var(--steel)}
ul.pack li.off .badge{color:var(--stone);font-weight:500;text-transform:none;letter-spacing:0}
.packnote{color:var(--stone);font-size:13px;margin:0 0 10px}
.cmd{
  display:block;background:var(--code-bg);border:1px solid var(--hairline);
  border-radius:var(--r-md);padding:10px 13px;margin:6px 0;color:var(--code-ink);
  font-family:var(--mono);font-size:12.5px;overflow-x:auto;white-space:pre;
}
.note{color:var(--stone);font-size:13px;margin:8px 0 0}
.ok-line{color:var(--success);font-weight:500;margin:10px 0 0}
.err-line{color:var(--error);font-weight:500;margin:10px 0 0}
#uplog .cmd{max-height:220px;overflow:auto;white-space:pre-wrap;font-size:12px}
a{color:var(--primary)}

/* ── responsive ─────────────────────────────────────────────────────────── */
@media (max-width:900px){
  header{padding:14px 16px 0} main{padding:0 16px 64px}
  thead th{top:auto;position:static}
  .tablewrap{overflow-x:auto}
  .col-author,.col-act{display:none}
  input[type=search]{flex:1 1 100%}
}
@media (max-width:600px){
  .col-source{display:none}
  table{min-width:480px}
  aside{padding:20px 18px 64px}
  .fields{grid-template-columns:1fr;gap:2px 0}
  .fields dt{margin-top:10px}
}
@media (prefers-reduced-motion:reduce){
  aside{transition:transform .01ms} .scrim{transition:opacity .01ms}
}
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>Skillview</h1>
    <span class="count" id="count" aria-live="polite"></span>
    <span class="spacer"></span>
    <button id="theme" class="icon-btn" aria-label="Switch to dark theme"></button>
    <button id="describe">Generate descriptions</button>
    <button id="refresh" class="primary">Check for updates</button>
  </div>
  <nav class="views" id="views" role="tablist" aria-label="Saved views"></nav>
  <div class="filters">
    <label class="vh" for="q">Search skills</label>
    <input type="search" id="q" placeholder="Search name, author, description…">
    <label class="vh" for="fmech">Filter by source</label>
    <select id="fmech"><option value="">Any source</option></select>
    <label class="vh" for="fact">Filter by activation</label>
    <select id="fact"><option value="">Any activation</option></select>
    <label class="vh" for="fauthor">Filter by author</label>
    <select id="fauthor"><option value="">Any author</option></select>
    <button id="clear">Clear filters</button>
  </div>
</header>

<main>
  <div class="tablewrap">
    <table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table>
  </div>
  <div class="empty" id="empty" hidden></div>
</main>

<div class="scrim" id="scrim"></div>
<aside id="panel" role="dialog" aria-modal="true" aria-labelledby="dtitle" aria-hidden="true">
  <button class="x" id="close">Close</button><div id="detail"></div>
</aside>

<script>
const ICON = {
  sortAsc:'<svg viewBox="0 0 16 16"><path d="M8 12V4M4.5 7.5 8 4l3.5 3.5"/></svg>',
  sortDesc:'<svg viewBox="0 0 16 16"><path d="M8 4v8M4.5 8.5 8 12l3.5-3.5"/></svg>',
  chev:'<svg viewBox="0 0 16 16"><path d="m6 3.5 5 4.5-5 4.5"/></svg>',
  sun:'<svg viewBox="0 0 20 20" width="18" height="18"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.5v2M10 16.5v2M3.5 10h-2M18.5 10h-2M5.4 5.4 4 4M16 16l-1.4-1.4M14.6 5.4 16 4M4 16l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 20 20" width="18" height="18"><path d="M16.5 11.8A7 7 0 0 1 8.2 3.5a7 7 0 1 0 8.3 8.3Z"/></svg>',
};
const COLS = [
  ["name","Name",""],["mechanism","Source","col-source"],
  ["plain","What it does for you",""],["author","Author","col-author"],
  ["activation","Activation","col-act"],["update","Update",""],
];
const VIEWS = {
  "Everything":       () => true,
  "Plugins":          r => r.mechanism === "marketplace",
  "Yours":            r => r.is_local,
  "Needs setup":      r => r.activation === "needs starting",
  "Update available": r => r.update === "update available",
};
let ITEMS = [], VIEW = "Everything", SORT = {key:"name", dir:1}, CLI = true,
    UPDATES = false, LAST_FOCUS = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── theme ─────────────────────────────────────────────────────────────── */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  const dark = t === "dark";
  $("#theme").innerHTML = dark ? ICON.sun : ICON.moon;
  $("#theme").setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
  try { localStorage.setItem("skillview-theme", t); } catch (e) {}
}
setTheme(( () => {
  try { return localStorage.getItem("skillview-theme"); } catch (e) { return null; }
})() || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("#theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

/* ── data ──────────────────────────────────────────────────────────────── */
async function load(url = "/api/items") {
  const btn = $("#refresh"), was = btn.textContent;
  if (url.includes("refresh")) { btn.disabled = true; btn.textContent = "Checking…"; }
  try {
    const d = await (await fetch(url)).json();
    ITEMS = d.items || []; CLI = d.cli; UPDATES = !!d.updates;
  } catch (e) {
    ITEMS = []; $("#empty").innerHTML = "<b>Can't reach the local server</b>Is app.py still running?";
  }
  btn.disabled = false; btn.textContent = was;
  $("#describe").disabled = !CLI;
  $("#describe").title = CLI ? "" : "The claude CLI is not on PATH";
  buildFilters(); render();
}

function buildFilters() {
  const fill = (sel, vals, label) => {
    const cur = sel.value;
    sel.innerHTML = `<option value="">${label}</option>` + [...new Set(vals)].filter(Boolean).sort()
      .map(v => `<option${v === cur ? " selected" : ""}>${esc(v)}</option>`).join("");
  };
  fill($("#fmech"), ITEMS.map(r => r.mechanism), "Any source");
  fill($("#fact"), ITEMS.map(r => r.activation), "Any activation");
  fill($("#fauthor"), ITEMS.map(r => r.author), "Any author");
}

function visible() {
  const q = $("#q").value.trim().toLowerCase();
  const mech = $("#fmech").value, act = $("#fact").value, au = $("#fauthor").value;
  return ITEMS.filter(VIEWS[VIEW]).filter(r =>
    (!mech || r.mechanism === mech) && (!act || r.activation === act) && (!au || r.author === au) &&
    (!q || [r.name, r.author, r.plain, r.description, r.source_repo].join(" ").toLowerCase().includes(q))
  ).sort((a, b) => {
    const k = SORT.key, x = (a[k] ?? "").toString().toLowerCase(), y = (b[k] ?? "").toString().toLowerCase();
    return x < y ? -SORT.dir : x > y ? SORT.dir : 0;
  });
}

/* ── render ────────────────────────────────────────────────────────────── */
function render() {
  $("#views").innerHTML = Object.keys(VIEWS).map(v =>
    `<button role="tab" aria-selected="${v === VIEW}" data-v="${esc(v)}">${esc(v)}
     <span class="n">${ITEMS.filter(VIEWS[v]).length}</span></button>`).join("");

  $("#head").innerHTML = COLS.map(([k, label, cls]) =>
    `<th scope="col" class="${cls}" ${SORT.key === k ? `aria-sort="${SORT.dir > 0 ? "ascending" : "descending"}"` : ""}>
      <button data-k="${k}">${label}${SORT.key === k ? (SORT.dir > 0 ? ICON.sortAsc : ICON.sortDesc) : ""}</button>
     </th>`).join("") + '<th scope="col"><span class="vh">Details</span></th>';

  const active = ["#q", "#fmech", "#fact", "#fauthor"].filter(s => $(s).value);
  ["#q", "#fmech", "#fact", "#fauthor"].forEach(s => $(s).classList.toggle("active", !!$(s).value));
  $("#clear").classList.toggle("show", active.length > 0);

  const rows = visible();
  $("#count").textContent = rows.length === ITEMS.length
    ? `${ITEMS.length} installed` : `${rows.length} of ${ITEMS.length}`;
  $("#empty").hidden = rows.length > 0;
  if (!rows.length) $("#empty").innerHTML = ITEMS.length
    ? "<b>Nothing matches</b>Try clearing a filter."
    : "<b>Nothing installed yet</b>No plugins, skills, or packs found on this machine.";

  $("#rows").innerHTML = rows.map(r => {
    const i = ITEMS.indexOf(r), ships = (r.subcommands || []).length;
    return `<tr tabindex="0" data-i="${i}" aria-label="${esc(r.name)}, view details">
      <td class="name">${esc(r.name)}${ships
        ? `<span class="sub">plugin · ships ${ships}</span>`
        : r.version ? `<span class="sub mono">${esc(r.version)}</span>` : ""}</td>
      <td class="col-source"><span class="pill" data-m="${esc(r.mechanism)}">${esc(r.mechanism)}</span></td>
      <td class="plain"><span class="${r.plain_generated ? "" : "raw"}">${esc(r.plain || "—")}</span></td>
      <td class="col-author">${esc(r.author || "—")}</td>
      <td class="col-act"><span class="state ${r.activation === "auto" ? "s-rest" : "s-act"}">
        ${r.activation === "auto" ? "" : '<span class="dot"></span>'}${esc(r.activation)}</span></td>
      <td><span class="state ${upClass(r.update)}">${esc(r.update || "—")}</span></td>
      <td class="chev">${ICON.chev}</td>
    </tr>`;
  }).join("");
}
const bytes = n => n >= 1e9 ? (n / 1e9).toFixed(1) + " GB"
  : n >= 1e6 ? (n / 1e6).toFixed(1) + " MB"
  : n >= 1e3 ? Math.round(n / 1e3) + " KB" : n + " B";
const upClass = u => u === "up to date" ? "s-ok"
  : (u === "update available" || u === "update manually") ? "s-act" : "s-rest";

/* ── detail panel ──────────────────────────────────────────────────────── */
function openDetail(i) {
  const r = ITEMS[i]; if (!r) return;
  LAST_FOCUS = document.activeElement;
  const f = [], add = (k, v) => v && f.push(`<dt>${k}</dt><dd>${v}</dd>`);
  add("Kind", esc(r.kind));
  add("Source", esc(r.mechanism));
  add("Author", r.is_local ? "you — no upstream" : esc(r.author || "unknown"));
  add("Version", r.version ? `<span class="mono">${esc(r.version)}</span>` : "");
  add("Available in", esc((r.surfaces || []).join(", ")));
  add("Activation", esc(r.activation));
  add("Update", r.update ? esc(r.update) : "not checked yet");
  add("On disk", r.size ? esc(bytes(r.size)) : "");
  add("Installed", r.installed_at ? esc(r.installed_at.slice(0, 10)) : "");
  add("Repository", r.source_url
    ? `<a href="${esc(r.source_url.replace(/\.git$/, ""))}" target="_blank" rel="noopener">${esc(r.source_repo || r.source_url)}</a>` : "");
  add("Path", `<span class="mono">${esc(r.install_path || "—")}</span>`);

  let html = `<h2 id="dtitle">${esc(r.name)}</h2>
    <div class="by">${r.is_local ? "Written by you" : "by " + esc(r.author || "unknown")}</div>
    <p class="blurb ${r.plain_generated ? "" : "rawnote"}">${esc(r.plain || "No description available.")}</p>
    ${r.plain_generated ? "" : '<p class="note">Raw description from the file. Use <b>Generate descriptions</b> for a plain-English one.</p>'}
    <dl class="fields">${f.join("")}</dl>`;

  if (r.needs_running?.length)
    html += `<h3>Requires running</h3><p>${r.needs_running.map(esc).join(", ")} must be open before this works.</p>`;
  if (r.prereqs?.length)
    html += `<h3>Set up first</h3>` + r.prereqs.map(c => `<code class="cmd">${esc(c)}</code>`).join("");
  if (r.update_command) {
    html += `<h3>To update</h3><code class="cmd">${esc(r.update_command)}</code>`;
    if (!UPDATES) {
      html += `<p class="note">Skillview is running read-only. Start it with
        <code>--enable-updates</code> to run this from here.</p>`;
    } else {
      // Only push the action when there is something to fetch. The ecosystem
      // command re-checks and no-ops anyway, so running it on a current item is
      // safe — just a pointless round trip. Offered quietly rather than removed,
      // because this status is only as fresh as the last refresh.
      const stale = r.update === "update available";
      const unchecked = !r.update || r.update === "unknown";
      html += unchecked
        ? `<p class="note">Not checked yet — run <b>Check for updates</b> first, so this
           only downloads if something has actually changed.</p>
           <p><button id="doupdate" data-name="${esc(r.name)}">Update anyway</button></p>`
        : stale
          ? `<p><button id="doupdate" class="primary" data-name="${esc(r.name)}">Run this update</button></p>`
          : `<p class="note">Already up to date as of the last check — nothing to download.</p>
             <p><button id="doupdate" data-name="${esc(r.name)}">Re-check and update</button></p>`;
      html += `<div id="uplog"></div>`;
    }
  }

  const subs = r.subcommands || [];
  if (subs.length) {
    html += `<h3>Ships ${subs.length} thing${subs.length > 1 ? "s" : ""}</h3>`;
    let n = 0;
    for (const kind of ["skill", "command", "agent", "hook", "mcp"]) {
      const of = subs.filter(s => s.kind === kind);
      if (!of.length) continue;
      html += `<div class="kindhead">${kind}${of.length > 1 ? "s" : ""} (${of.length})</div><ol class="subs">` +
        of.map(s => `<li data-n="${++n}"><span class="inv">${esc(s.invoke || s.name)}</span>
          <span class="does">${esc(s.does || "No description provided.")}</span></li>`).join("") + "</ol>";
    }
  } else {
    html += `<h3>Sub-commands</h3><p class="note">None — this is a single capability.</p>`;
  }
  if (r.readme?.endsWith(".md"))
    html += `<p class="note">Full docs: <span class="mono">${esc(r.readme)}</span></p>`;

  if (r.source_repo && r.source_path) html += `<div id="pack"></div>`;

  $("#detail").innerHTML = html;
  if (r.source_repo && r.source_path) loadPack(r);
  $("#panel").classList.add("on"); $("#panel").setAttribute("aria-hidden", "false");
  $("#scrim").classList.add("on");
  $("#close").focus();
}
/* The pack this skill came from — fetched when the panel opens rather than
   during refresh, because most packs are never looked at. */
async function loadPack(r) {
  const box = $("#pack"); if (!box) return;
  box.innerHTML = `<h3>Also in this pack</h3><p class="packnote">Checking ${esc(r.source_repo)}…</p>`;
  let d;
  try {
    d = await (await fetch(`/api/catalog?repo=${encodeURIComponent(r.source_repo)}`
      + `&path=${encodeURIComponent(r.source_path)}`)).json();
  } catch (e) { d = { error: "Could not reach the repository." }; }
  if (!$("#pack")) return;                       // panel closed while fetching

  const skills = d.skills || [];
  if (d.error || !skills.length) {
    box.innerHTML = `<h3>Also in this pack</h3><p class="packnote">${
      esc(d.error || "Nothing else ships from this repository.")}</p>`;
    return;
  }
  const have = skills.filter(s => s.installed).length;
  box.innerHTML = `<h3>Also in this pack</h3>
    <p class="packnote">${esc(r.source_repo)} ships ${skills.length} skills —
      you have ${have}. The rest are not installed.</p>
    <ul class="pack">` + skills.map(s => `
      <li class="${s.installed ? "" : "off"}">
        <span class="nm">${esc(s.name)}</span>
        <span class="badge">${s.installed ? "installed" : "not installed"}</span>
        <span class="d">${esc(s.description || "No description upstream.")}</span>
      </li>`).join("") + `</ul>
    <p class="note">Install any of these with
      <code class="cmd">npx skills@latest add ${esc(r.source_repo)}</code></p>`;
}

function closeDetail() {
  if (!$("#panel").classList.contains("on")) return;
  $("#panel").classList.remove("on"); $("#panel").setAttribute("aria-hidden", "true");
  $("#scrim").classList.remove("on");
  LAST_FOCUS?.focus();            // return focus to the row that opened it
}

/* ── events ────────────────────────────────────────────────────────────── */
$("#views").onclick = e => { const b = e.target.closest("button"); if (b) { VIEW = b.dataset.v; render(); } };
$("#head").onclick = e => {
  const k = e.target.closest("button")?.dataset.k; if (!k) return;
  SORT = { key: k, dir: SORT.key === k ? -SORT.dir : 1 }; render();
};
$("#rows").onclick = e => { const tr = e.target.closest("tr"); if (tr) openDetail(+tr.dataset.i); };
$("#rows").onkeydown = e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const tr = e.target.closest("tr"); if (!tr) return;
  e.preventDefault(); openDetail(+tr.dataset.i);
};
["#q", "#fmech", "#fact", "#fauthor"].forEach(s => $(s).oninput = render);
$("#clear").onclick = () => {
  ["#q", "#fmech", "#fact", "#fauthor"].forEach(s => $(s).value = "");
  render(); $("#q").focus();
};
$("#detail").onclick = async e => {
  const b = e.target.closest("#doupdate"); if (!b) return;
  const log = $("#uplog"), label = b.textContent;
  b.disabled = true; b.textContent = "Running…";
  log.innerHTML = `<p class="note">This can take a minute.</p>`;
  let d;
  try {
    d = await (await fetch("/api/update", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: b.dataset.name }),
    })).json();
  } catch (err) { d = { ok: false, error: "The request failed." }; }
  b.disabled = false; b.textContent = label;
  log.innerHTML =
    (d.ok ? `<p class="ok-line">Updated.</p>` : `<p class="err-line">${esc(d.error)}</p>`) +
    (d.restart_required
      ? `<p class="note"><b>Restart Claude Code</b> for this to take effect —
         the files changed on disk, but the running session still has the old copy.</p>` : "") +
    (d.log ? `<code class="cmd">${esc(d.log)}</code>` : "");
  if (d.ok) load("/api/refresh");
};
$("#scrim").onclick = closeDetail;
$("#close").onclick = closeDetail;
// Must not return a value: a DOM0 handler returning false calls preventDefault(),
// which silently swallows every keystroke on the page.
document.onkeydown = e => {
  if (e.key === "Escape") { closeDetail(); return; }
  if (e.key !== "Tab" || !$("#panel").classList.contains("on")) return;
  const f = $("#panel").querySelectorAll('button,a[href],input,select,[tabindex]:not([tabindex="-1"])');
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
};
// Keep the sticky table header parked directly under the real page header,
// which changes height whenever the filter row wraps.
const syncHead = () => document.documentElement.style.setProperty(
  "--head-h", $("header").getBoundingClientRect().height + "px");
addEventListener("resize", syncHead);
new ResizeObserver(syncHead).observe($("header"));

$("#refresh").onclick = () => load("/api/refresh");
$("#describe").onclick = async () => {
  const b = $("#describe"); b.disabled = true; b.textContent = "Writing…";
  const r = await fetch("/api/describe", { method: "POST" }).then(x => x.json()).catch(() => ({ error: "Request failed." }));
  b.textContent = "Generate descriptions"; b.disabled = false;
  if (r.error) alert(r.error);
  load();
};

load();
</script>
</body>
</html>
