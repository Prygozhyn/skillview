<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skillview</title>
<style>
/* One dark surface, one accent, one rule: the table is for scanning and the
   panel is for reading. Nothing competes with the rows. */
:root{
  --bg:#0e1014; --bg2:#151922; --row:#12151c; --rowalt:#141821;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --tx:#e9edf5; --dim:#9aa4b6; --faint:#6f7789;
  --acc:#7aa2ff; --ok:#6fce92; --warn:#e5b567; --bad:#e58a76; --mute:#5b6376;
  --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--tx); font:14px/1.5 ui-sans-serif,-apple-system,
  "SF Pro Text",system-ui,sans-serif; -webkit-font-smoothing:antialiased;
}
code,.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px}

/* ── chrome ─────────────────────────────────────────────────────────────── */
header{
  position:sticky;top:0;z-index:20;background:rgba(14,16,20,.93);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:14px 20px 0;
}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px}
.count{color:var(--faint);font-size:12.5px}
.spacer{flex:1}
button{
  font:inherit;font-size:12.5px;color:var(--tx);background:var(--bg2);
  border:1px solid var(--line2);border-radius:6px;padding:5px 11px;cursor:pointer;
}
button:hover{border-color:var(--acc);color:#fff}
button:disabled{opacity:.45;cursor:default;border-color:var(--line)}
button.primary{background:rgba(122,162,255,.13);border-color:rgba(122,162,255,.4)}

.views{display:flex;gap:2px;margin:12px 0 0;flex-wrap:wrap}
.views button{
  background:none;border:none;border-bottom:2px solid transparent;border-radius:0;
  color:var(--dim);padding:7px 12px;
}
.views button.on{color:var(--tx);border-bottom-color:var(--acc)}
.views button:hover{color:var(--tx)}
.views .n{color:var(--faint);font-size:11px;margin-left:5px}

.filters{display:flex;gap:8px;padding:10px 0 12px;flex-wrap:wrap}
input[type=search],select{
  font:inherit;font-size:12.5px;color:var(--tx);background:var(--row);
  border:1px solid var(--line2);border-radius:6px;padding:5px 9px;
}
input[type=search]{min-width:230px}
input[type=search]:focus,select:focus{outline:none;border-color:var(--acc)}

/* ── table ──────────────────────────────────────────────────────────────── */
main{padding:0 20px 60px}
table{width:100%;border-collapse:collapse;table-layout:auto}
thead th{
  position:sticky;top:120px;background:var(--bg);z-index:10;
  text-align:left;font-size:11px;font-weight:600;letter-spacing:.5px;
  text-transform:uppercase;color:var(--faint);padding:9px 10px;
  border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none;
}
thead th:hover{color:var(--dim)}
thead th .ar{opacity:.5;font-size:9px}
tbody tr{border-bottom:1px solid var(--line);background:var(--row)}
tbody tr:nth-child(even){background:var(--rowalt)}
tbody tr:hover{background:#191e28}
td{padding:9px 10px;vertical-align:top}
td.name{font-weight:550;white-space:nowrap}
td.name .sub{display:block;font-weight:400;color:var(--faint);font-size:11.5px;margin-top:1px}
td.plain{color:var(--dim);max-width:400px;min-width:220px}
td.plain .raw{color:var(--mute);font-style:italic}
.tag{
  display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;
  border:1px solid var(--line2);color:var(--dim);white-space:nowrap;
}
.tag.mech-marketplace{border-color:rgba(122,162,255,.35);color:#9dbaff}
.tag.mech-local{border-color:rgba(111,206,146,.3);color:#8fd8ab}
.tag.mech-unknown{border-color:rgba(229,181,103,.32);color:#e9c584}
.act-auto{color:var(--ok)} .act-manual{color:var(--acc)}
.act-needs{color:var(--warn)}
.up{font-size:12px;white-space:nowrap}
.up-uptodate{color:var(--ok)} .up-update{color:var(--warn);font-weight:600}
.up-none{color:var(--mute)} .up-unknown{color:var(--faint)}
.up-manual{color:var(--warn)}
.viewbtn{padding:3px 10px;font-size:11.5px}
.empty{padding:70px 20px;text-align:center;color:var(--faint)}
.empty b{display:block;color:var(--dim);font-size:15px;margin-bottom:8px;font-weight:550}

/* ── detail panel — a separate reading surface, not a tooltip ───────────── */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;
  opacity:0;pointer-events:none;transition:opacity .16s;
}
.scrim.on{opacity:1;pointer-events:auto}
aside{
  position:fixed;top:0;right:0;bottom:0;width:min(680px,94vw);z-index:31;
  background:var(--bg2);border-left:1px solid var(--line2);
  transform:translateX(100%);transition:transform .2s cubic-bezier(.3,0,.2,1);
  overflow-y:auto;padding:22px 26px 60px;
}
aside.on{transform:none}
aside h2{margin:0 0 3px;font-size:20px;font-weight:600}
aside .by{color:var(--faint);font-size:12.5px;margin-bottom:18px}
aside .x{position:absolute;top:16px;right:20px}
.fields{display:grid;grid-template-columns:130px 1fr;gap:7px 16px;margin:16px 0 22px;font-size:13px}
.fields dt{color:var(--faint)}
.fields dd{margin:0;word-break:break-word}
.blurb{
  background:var(--row);border:1px solid var(--line);border-left:2px solid var(--acc);
  border-radius:var(--r);padding:11px 14px;margin:0 0 6px;color:var(--tx);
}
.blurb.rawnote{border-left-color:var(--mute);color:var(--dim)}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);
   margin:24px 0 9px;font-weight:600}
ol.subs{margin:0;padding-left:0;list-style:none;counter-reset:s}
ol.subs li{
  counter-increment:s;background:var(--row);border:1px solid var(--line);
  border-radius:var(--r);padding:9px 12px 9px 38px;margin-bottom:6px;position:relative;
}
ol.subs li::before{
  content:counter(s);position:absolute;left:12px;top:9px;color:var(--faint);
  font-size:11.5px;font-family:ui-monospace,monospace;
}
ol.subs .inv{color:var(--acc);font-weight:600}
ol.subs .does{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.kindhead{color:var(--faint);font-size:11px;text-transform:uppercase;
          letter-spacing:.5px;margin:14px 0 6px}
.cmd{
  display:block;background:#0b0d11;border:1px solid var(--line2);border-radius:6px;
  padding:8px 11px;margin:5px 0;color:#cfe0ff;overflow-x:auto;white-space:pre;
}
.note{color:var(--faint);font-size:12.5px;margin:6px 0 0}
a{color:var(--acc)}
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>Skillview</h1>
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <button id="describe">Generate descriptions</button>
    <button id="refresh" class="primary">Check for updates</button>
  </div>
  <nav class="views" id="views"></nav>
  <div class="filters">
    <input type="search" id="q" placeholder="Search name, author, description…">
    <select id="fmech"><option value="">Any mechanism</option></select>
    <select id="fact"><option value="">Any activation</option></select>
    <select id="fauthor"><option value="">Any author</option></select>
  </div>
</header>

<main>
  <table>
    <thead><tr id="head"></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden></div>
</main>

<div class="scrim" id="scrim"></div>
<aside id="panel"><button class="x" id="close">Close</button><div id="detail"></div></aside>

<script>
const COLS = [
  ["name","Name"],["kind","Kind"],["mechanism","Mechanism"],["plain","What it does for you"],
  ["author","Author"],["surfaces","Surface"],["activation","Activation"],
  ["version","Version"],["update","Update"],["",""],
];
const VIEWS = {
  "Everything":       () => true,
  "Plugins":          r => r.mechanism === "marketplace",
  "Locally authored": r => r.is_local,
  "Needs starting":   r => r.activation === "needs starting",
  "Update available": r => r.update === "update available",
};

let ITEMS = [], VIEW = "Everything", SORT = {key:"name", dir:1}, CLI = true;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── data ──────────────────────────────────────────────────────────────── */
async function load(url = "/api/items") {
  const btn = $("#refresh"); const was = btn.textContent;
  if (url.includes("refresh")) { btn.disabled = true; btn.textContent = "Checking…"; }
  try {
    const r = await fetch(url); const d = await r.json();
    ITEMS = d.items || []; CLI = d.cli;
  } catch (e) {
    ITEMS = []; $("#empty").textContent = "Could not reach the local server.";
  }
  btn.disabled = false; btn.textContent = was;
  $("#describe").disabled = !CLI;
  $("#describe").title = CLI ? "" : "The `claude` CLI is not on PATH";
  buildFilters(); render();
}

/* ── filters ───────────────────────────────────────────────────────────── */
function buildFilters() {
  const fill = (sel, vals, label) => {
    const cur = sel.value;
    sel.innerHTML = `<option value="">${label}</option>` +
      [...new Set(vals)].filter(Boolean).sort()
        .map(v => `<option${v === cur ? " selected" : ""}>${esc(v)}</option>`).join("");
  };
  fill($("#fmech"), ITEMS.map(r => r.mechanism), "Any mechanism");
  fill($("#fact"), ITEMS.map(r => r.activation), "Any activation");
  fill($("#fauthor"), ITEMS.map(r => r.author), "Any author");
}

function visible() {
  const q = $("#q").value.trim().toLowerCase();
  const mech = $("#fmech").value, act = $("#fact").value, au = $("#fauthor").value;
  return ITEMS.filter(VIEWS[VIEW]).filter(r =>
    (!mech || r.mechanism === mech) && (!act || r.activation === act) &&
    (!au || r.author === au) &&
    (!q || [r.name, r.author, r.plain, r.description, r.source_repo]
      .join(" ").toLowerCase().includes(q))
  ).sort((a, b) => {
    const k = SORT.key, x = (a[k] ?? "").toString().toLowerCase(),
          y = (b[k] ?? "").toString().toLowerCase();
    return x < y ? -SORT.dir : x > y ? SORT.dir : 0;
  });
}

/* ── render ────────────────────────────────────────────────────────────── */
function render() {
  $("#views").innerHTML = Object.keys(VIEWS).map(v =>
    `<button class="${v === VIEW ? "on" : ""}" data-v="${esc(v)}">${esc(v)}
     <span class="n">${ITEMS.filter(VIEWS[v]).length}</span></button>`).join("");

  $("#head").innerHTML = COLS.map(([k, label]) => k
    ? `<th data-k="${k}">${label}${SORT.key === k ? ` <span class="ar">${SORT.dir > 0 ? "▲" : "▼"}</span>` : ""}</th>`
    : "<th></th>").join("");

  const rows = visible();
  $("#count").textContent = `${rows.length} of ${ITEMS.length} shown`;
  $("#empty").hidden = rows.length > 0;
  if (!rows.length) {
    $("#empty").innerHTML = ITEMS.length
      ? "<b>Nothing matches</b>Try clearing a filter."
      : "<b>Nothing installed yet</b>No plugins, skills, or packs found on this machine.";
  }

  $("#rows").innerHTML = rows.map((r, i) => `<tr data-i="${ITEMS.indexOf(r)}">
    <td class="name">${esc(r.name)}${r.parent ? `<span class="sub">in ${esc(r.parent)}</span>` : ""}</td>
    <td><span class="tag">${esc(r.kind)}</span></td>
    <td><span class="tag mech-${esc(r.mechanism)}">${esc(r.mechanism)}</span></td>
    <td class="plain">${r.plain
        ? `<span class="${r.plain_generated ? "" : "raw"}">${esc(trim(r.plain, 150))}</span>`
        : '<span class="raw">—</span>'}</td>
    <td>${esc(r.author || "—")}</td>
    <td>${esc((r.surfaces || []).join(", ") || "—")}</td>
    <td class="${actClass(r.activation)}">${esc(r.activation)}</td>
    <td class="mono">${esc(r.version || "—")}</td>
    <td class="up ${upClass(r.update)}">${esc(r.update || "—")}</td>
    <td><button class="viewbtn" data-view="${ITEMS.indexOf(r)}">View</button></td>
  </tr>`).join("");
}

const trim = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
const actClass = a => a === "auto" ? "act-auto" : a === "manual" ? "act-manual" : "act-needs";
const upClass = u => ({"up to date":"up-uptodate","update available":"up-update",
  "no upstream":"up-none","unknown":"up-unknown","update manually":"up-manual"})[u] || "up-none";

/* ── detail panel ──────────────────────────────────────────────────────── */
function openDetail(i) {
  const r = ITEMS[i]; if (!r) return;
  const f = [];
  const add = (k, v) => v && f.push(`<dt>${k}</dt><dd>${v}</dd>`);
  add("Kind", esc(r.kind));
  add("Mechanism", esc(r.mechanism));
  add("Author", r.is_local ? "you — no upstream" : esc(r.author || "unknown"));
  add("Version", r.version ? `<span class="mono">${esc(r.version)}</span>` : "");
  add("Surface", esc((r.surfaces || []).join(", ")));
  add("Activation", `<span class="${actClass(r.activation)}">${esc(r.activation)}</span>`);
  add("Update", r.update ? `<span class="up ${upClass(r.update)}">${esc(r.update)}</span>` : "not checked yet");
  add("Installed", r.installed_at ? esc(r.installed_at.slice(0, 10)) : "");
  add("Source", r.source_url
    ? `<a href="${esc(r.source_url.replace(/\.git$/, ""))}" target="_blank" rel="noopener">${esc(r.source_repo || r.source_url)}</a>` : "");
  add("Path", `<span class="mono">${esc(r.install_path || "—")}</span>`);

  let html = `<h2>${esc(r.name)}</h2>
    <div class="by">${r.is_local ? "Written by you" : "by " + esc(r.author || "unknown")}</div>
    <div class="blurb ${r.plain_generated ? "" : "rawnote"}">${esc(r.plain || "No description available.")}</div>
    ${r.plain_generated ? "" : '<p class="note">This is the raw description from the file. Click <b>Generate descriptions</b> for a plain-English version.</p>'}
    <dl class="fields">${f.join("")}</dl>`;

  if (r.needs_running?.length)
    html += `<h3>Requires running</h3><p>${r.needs_running.map(esc).join(", ")} must be open before this works.</p>`;
  if (r.prereqs?.length)
    html += `<h3>Set up first</h3>` + r.prereqs.map(c => `<code class="cmd">${esc(c)}</code>`).join("");
  if (r.update_command)
    html += `<h3>To update</h3><code class="cmd">${esc(r.update_command)}</code>
             <p class="note">v1 shows the command; running it from here lands in v2.</p>`;

  const subs = r.subcommands || [];
  if (subs.length) {
    html += `<h3>Ships ${subs.length} thing${subs.length > 1 ? "s" : ""}</h3>`;
    for (const kind of ["skill", "command", "agent", "hook", "mcp"]) {
      const of = subs.filter(s => s.kind === kind);
      if (!of.length) continue;
      html += `<div class="kindhead">${kind}${of.length > 1 ? "s" : ""} (${of.length})</div><ol class="subs">` +
        of.map(s => `<li><span class="inv">${esc(s.invoke || s.name)}</span>
          <span class="does">${esc(s.does || "No description provided.")}</span></li>`).join("") + "</ol>";
    }
  } else {
    html += `<h3>Sub-commands</h3><p class="note">This one has none — it's a single capability.</p>`;
  }
  if (r.readme?.endsWith(".md"))
    html += `<p class="note">Full docs: <span class="mono">${esc(r.readme)}</span></p>`;

  $("#detail").innerHTML = html;
  $("#panel").classList.add("on"); $("#scrim").classList.add("on");
}
function closeDetail() {
  $("#panel").classList.remove("on"); $("#scrim").classList.remove("on");
}

/* ── events ────────────────────────────────────────────────────────────── */
$("#views").onclick = e => { const b = e.target.closest("button"); if (b) { VIEW = b.dataset.v; render(); } };
$("#head").onclick = e => {
  const k = e.target.closest("th")?.dataset.k; if (!k) return;
  SORT = { key: k, dir: SORT.key === k ? -SORT.dir : 1 }; render();
};
$("#rows").onclick = e => {
  const b = e.target.closest("[data-view]");
  if (b) return openDetail(+b.dataset.view);
  const tr = e.target.closest("tr"); if (tr) openDetail(+tr.dataset.i);
};
["#q", "#fmech", "#fact", "#fauthor"].forEach(s => $(s).oninput = render);
$("#scrim").onclick = closeDetail;
$("#close").onclick = closeDetail;
document.onkeydown = e => e.key === "Escape" && closeDetail();
$("#refresh").onclick = () => load("/api/refresh");
$("#describe").onclick = async () => {
  const b = $("#describe"); b.disabled = true; b.textContent = "Writing…";
  const r = await fetch("/api/describe", { method: "POST" }).then(x => x.json()).catch(() => ({ error: "failed" }));
  b.textContent = "Generate descriptions"; b.disabled = false;
  if (r.error) alert(r.error);
  load();
};

load();
</script>
</body>
</html>
